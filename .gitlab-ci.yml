# GitLab Pages CI/CD Pipeline for Angular
# Documentation: https://docs.gitlab.com/ee/user/project/pages/

image: node:20-alpine

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

variables:
  # Enable npm cache in project directory for GitLab CI caching
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

before_script:
  - npm ci --prefer-offline

# Build job to test PRs/merge requests
build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

# Pages deployment job (publishes static site to GitLab Pages)
pages:
  stage: deploy
  script:
    # Build Angular application
    - npm run build -- --configuration production
    # GitLab Pages serves files from the 'public' directory at root of project artifact
    - rm -rf public
    - mkdir -p public
    - cp -r dist/mainsite/browser/* public/
    # Provide 404.html fallback for Single Page Application (SPA) client-side routing
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
